<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Template (Wasm)</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #composeApp, canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
    <!-- Polyfill for WEBGL_debug_renderer_info in Safari / WebKit -->
    <script>
        (function() {
            var UNMASKED_VENDOR_WEBGL = 0x9245;
            var UNMASKED_RENDERER_WEBGL = 0x9246;

            [window.WebGLRenderingContext, window.WebGL2RenderingContext].forEach(function(ctx) {
                if (!ctx) return;
                var origGetParameter = ctx.prototype.getParameter;
                ctx.prototype.getParameter = function(pname) {
                    if (pname === UNMASKED_VENDOR_WEBGL) {
                        return 'Apple Inc.';
                    }
                    if (pname === UNMASKED_RENDERER_WEBGL) {
                        return 'Apple GPU';
                    }
                    return origGetParameter.call(this, pname);
                };
            });
        })();
    </script>
</head>
<body>
<div id="composeApp"></div>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
